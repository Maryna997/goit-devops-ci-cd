image:
  repository: 810738286133.dkr.ecr.us-west-2.amazonaws.com/ecr-repo-final-project
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 8000

ingress:
  enabled: false

config:
  POSTGRES_HOST: ""
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ""
  POSTGRES_USER: ""
  POSTGRES_NAME: ""
  POSTGRES_URL: ""
  DATABASE_URL: ""

secrets:
  POSTGRES_PASSWORD: ""

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
